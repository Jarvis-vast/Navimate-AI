<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress Vite HMR and WebSocket noise in iFrame sandbox environment per AI Studio guidelines
      (function() {
        const isViteNoise = function(...args) {
          return args.some(function(arg) {
            if (!arg) return false;
            const str = typeof arg === 'object'
              ? (arg.message || arg.stack || (typeof arg.toString === 'function' ? arg.toString() : ''))
              : String(arg);
            return (
              str.includes('[vite]') ||
              str.includes('[hmr]') ||
              str.includes('vite-hmr') ||
              str.includes('vite-ping') ||
              str.includes('WebSocket') ||
              str.includes('websocket') ||
              str.includes('ws://') ||
              str.includes('wss://')
            );
          });
        };

        const _origError = console.error;
        const _origWarn = console.warn;
        const _origInfo = console.info;
        const _origLog = console.log;
        const _origDebug = console.debug;

        console.error = function(...args) {
          if (isViteNoise(...args)) return;
          _origError.apply(console, args);
        };

        console.warn = function(...args) {
          if (isViteNoise(...args)) return;
          _origWarn.apply(console, args);
        };

        console.info = function(...args) {
          if (isViteNoise(...args)) return;
          _origInfo.apply(console, args);
        };

        console.log = function(...args) {
          if (isViteNoise(...args)) return;
          _origLog.apply(console, args);
        };

        console.debug = function(...args) {
          if (isViteNoise(...args)) return;
          _origDebug.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && (isViteNoise(e.message) || isViteNoise(e.error) || (e.target && e.target instanceof WebSocket))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && isViteNoise(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Cleanly mock Vite HMR WebSocket so it satisfies Vite's transport without failing connections
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const MockWebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const isViteWs =
              urlStr.includes('token=') ||
              urlStr.includes('vite') ||
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping')));

            if (isViteWs) {
              const listeners = {};
              const mockWs = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1, // OPEN
                url: urlStr,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr'),
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                addEventListener: function(event, cb) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb({ type: 'open', target: mockWs }); } catch (err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function(event) {
                  const cbs = listeners[event && event.type] || [];
                  cbs.forEach(function(fn) {
                    try { fn(event); } catch (err) {}
                  });
                  return true;
                },
                send: function() {},
                close: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };

              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') {
                  mockWs.onopen({ type: 'open', target: mockWs });
                }
              }, 0);

              return mockWs;
            }

            return new OrigWebSocket(url, protocols);
          };

          MockWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          MockWebSocket.OPEN = OrigWebSocket.OPEN;
          MockWebSocket.CLOSING = OrigWebSocket.CLOSING;
          MockWebSocket.CLOSED = OrigWebSocket.CLOSED;
          MockWebSocket.prototype = OrigWebSocket.prototype;

          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
