<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="nav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2563EB" stroke-width="4" opacity="0.4"/>
  <!-- Navigation arrow -->
  <g transform="translate(256, 256) rotate(-25) translate(-256, -256)" filter="url(#shadow)">
    <polygon points="256,110 370,370 256,310 142,370" fill="url(#nav)" stroke="#60A5FA" stroke-width="6"/>
    <polygon points="256,110 256,310 142,370" fill="#1E40AF" opacity="0.3"/>
  </g>
  <circle cx="256" cy="256" r="14" fill="#60A5FA"/>
</svg>
