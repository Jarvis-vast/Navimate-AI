name: NaviMate AI — Multi-Platform CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web:
    name: Web Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Lint Web
        run: npm run lint
      - name: Build Web / PWA
        run: npm run build
      - name: Report Web Status
        run: echo "WEB_VERIFICATION=PASS" >> $GITHUB_STEP_SUMMARY

  backend:
    name: Backend & Route Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Contract & Route Token Tests
        run: npm test
      - name: Report Backend Status
        run: echo "BACKEND_VERIFICATION=PASS" >> $GITHUB_STEP_SUMMARY

  android-unit-tests:
    name: Android Unit Tests & Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew :app:test --stacktrace
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests/

  android-build:
    name: Android Debug & Release Compile
    needs: [ android-unit-tests ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure Local Properties for Build
        run: |
          mkdir -p android
          echo "MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSy_CI_BUILD_VALIDATION_MOCK_KEY_7788' }}" > android/local.properties
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace
      - name: Assemble Release (Unsigned Compile)
        run: |
          cd android
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navimate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  android-instrumentation:
    name: Android Connected / Emulator Smoke
    needs: [ android-build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Android SDK & KVM
        run: |
          echo "KVM acceleration check:"
          ls -l /dev/kvm || true
      - name: Run Emulator Instrumentation or Record Boundary
        run: |
          # If hardware virtualization (KVM) or Google Play system image is not provisioned on standard runner:
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=Hardware Virtualization::No /dev/kvm hardware virtualization available on this runner. Connected emulator execution recorded as NOT RUN."
            echo "ANDROID_INSTRUMENTATION=NOT RUN (Host lacks nested KVM for Google Play Emulator)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "KVM detected. Running connected emulator tests..."
